<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Subtle luxury gradient for the dark squircle background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>

    <!-- Subtle brilliance radial shine behind diamond -->
    <radialGradient id="halo" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Luxury Obsidian Rounded Squircle Badge -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bgGrad)" stroke="#383838" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Subtle Halo Backlight -->
  <circle cx="256" cy="270" r="180" fill="url(#halo)"/>

  <!-- Diamond Gemstone Structure -->
  <g id="diamond" stroke="#121212" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Pavilion (Lower Facets) -->
    <!-- Far Left Pavilion -->
    <polygon points="116,230 186,230 256,412" fill="#B4BED0"/>
    <!-- Mid Left Pavilion -->
    <polygon points="186,230 256,230 256,412" fill="#E4E8EE"/>
    <!-- Mid Right Pavilion -->
    <polygon points="256,230 326,230 256,412" fill="#FFFFFF"/>
    <!-- Far Right Pavilion -->
    <polygon points="326,230 396,230 256,412" fill="#CBD4E2"/>

    <!-- Crown (Upper Facets) -->
    <!-- Center Table -->
    <polygon points="180,155 332,155 292,195 220,195" fill="#FFFFFF"/>

    <!-- Crown Kite & Star Facets -->
    <polygon points="180,155 220,195 186,230" fill="#E2E6EC"/>
    <polygon points="332,155 292,195 326,230" fill="#F8FAFC"/>
    <polygon points="220,195 292,195 256,230" fill="#FFFFFF"/>
    <polygon points="220,195 256,230 186,230" fill="#F0F3F7"/>
    <polygon points="292,195 326,230 256,230" fill="#DDE3EC"/>

    <!-- Crown Outer Triangles -->
    <polygon points="180,155 186,230 116,230" fill="#CBD4E0"/>
    <polygon points="332,155 396,230 326,230" fill="#CBD4E0"/>
  </g>

  <!-- Radiance Sparkle Flare 1 (Top Right) -->
  <g transform="translate(392, 136)">
    <!-- 4-point Diamond Star -->
    <path d="M 0,-34 Q 0,0 34,0 Q 0,0 0,34 Q 0,0 -34,0 Q 0,0 0,-34 Z" fill="#FFFFFF"/>
    <!-- Diagonal Subtle Glint -->
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#FFFFFF" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Radiance Sparkle Flare 2 (Left Girdle Point) -->
  <g transform="translate(114, 228)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>